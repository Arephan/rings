# rings.conf — what this fleet is for. One file, at the root of $RINGS_HOME.
#
# Loops are easy to accumulate and hard to kill, because each one is individually
# defensible. This file is the thing they have to be defensible *against*.

# The one outcome. If two things go here, you have two fleets.
APEX="__APEX__"

# Where work lands. id:Label, comma separated. Keep it to a handful — these are
# buckets you would reorganise a week around, not a taxonomy.
SINKS="revenue:Money in, proof:Machine still verified"
