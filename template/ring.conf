# ring.conf — the five primitives of one loop.
# Every line here is a decision you would otherwise make badly at 3am.

NAME="__NAME__"

# --- TRIGGER: when this ring wakes.
# Standard cron syntax. `rings install` translates it to launchd on macOS.
# On Linux also set ONCALENDAR (systemd syntax) — the two are not interchangeable.
SCHEDULE="17,47 * * * *"
# ONCALENDAR="*:17,47"

# --- GOAL: what runs. The prompt is RUNBOOK.md plus a generated context block.
# PROMPT_MODE=arg passes the prompt as the last argument; stdin pipes it in.
AGENT="claude -p --dangerously-skip-permissions --model claude-opus-5"
PROMPT_MODE="arg"

# --- VERIFIER: how the run proves it did something.
# The default verifier is "this file exists and is not empty" — the run deletes it
# first, so a ring cannot pass on last run's output. For anything stricter, write
# hooks/verify.sh; a non-zero exit marks the run unverified.
DELIVERABLE="out/last.md"

# --- STOP: the four rules that keep a loop from becoming a bill.
TIMEOUT=1500            # hard wall clock, seconds. The agent is killed, not asked.
LOCK_STALE=1800         # a lock older than this belonged to a run that died.
MAX_RUNS_PER_DAY=24     # 0 means unlimited. Type the 0 on purpose.
# touch .halt at any time to stop this ring without touching its schedule.

# --- MEMORY / OUTPUT
# stdout | none | slack | webhook | any shell command the message is piped into
NOTIFY="stdout"

# --- CHAIN: rings this one reads from. Documentation for `rings chain`, and the
# right place to look when a downstream ring starts producing nonsense.
NEEDS=""

# --- CONTRACT: the same claim, made checkable. See docs/contracts.md.
# EMITS is what this ring hands the fleet:  name:path:format:shelf-life-in-hours
# CONSUMES is what it takes:                producer.name[:key=value row filter]
# `rings contracts` reads both, then goes and looks: a consumer only counts if
# that ring's own files name the file. A handoff nobody reads is the bug.
EMITS=""
CONSUMES=""

# --- PURPOSE: which outcome in $RINGS_HOME/rings.conf this ring feeds.
# `rings goals` lists every ring under its sink, and names the ones under none.
SERVES=""
