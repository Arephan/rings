# Downstream ring. Reads the scout's deliverable. NEEDS is documentation for
# `rings chain`; the staleness check that actually protects this ring lives in
# hooks/pre.sh, because a chain you cannot verify is just two loops in a trenchcoat.
NAME="writer"
SCHEDULE="20 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/report.md"
TIMEOUT=60
MAX_RUNS_PER_DAY=24
NOTIFY="stdout"
NEEDS="scout"

# NEEDS is the drawing; this is the checkable version of the same claim.
CONSUMES="scout.findings"
