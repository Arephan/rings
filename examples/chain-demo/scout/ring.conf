# Upstream ring. Produces a fact file; knows nothing about who reads it.
NAME="scout"
SCHEDULE="5 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/findings.md"
TIMEOUT=60
MAX_RUNS_PER_DAY=24
NOTIFY="none"

# What it hands the fleet: name:path:format:shelf life in hours. `rings contracts`
# checks that something downstream actually reads it.
EMITS="findings:out/findings.md:markdown:2"
