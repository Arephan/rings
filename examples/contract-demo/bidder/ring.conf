# Downstream, and wired: this ring's own files name the file it reads, which is
# what `rings contracts` checks. It takes only the `lead` rows.
NAME="bidder"
SCHEDULE="25 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/bids.md"
TIMEOUT=60
MAX_RUNS_PER_DAY=24
NOTIFY="none"
NEEDS="scout"
SERVES="revenue"

CONSUMES="scout.leads:kind=lead"
