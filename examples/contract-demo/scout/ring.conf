# Upstream. Writes rows of two different kinds and does not care who takes them.
NAME="scout"
SCHEDULE="5 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/leads.jsonl"
TIMEOUT=60
MAX_RUNS_PER_DAY=24
NOTIFY="none"
SERVES="revenue"

# name:path:format:shelf life in hours
EMITS="leads:out/leads.jsonl:jsonl:72"
