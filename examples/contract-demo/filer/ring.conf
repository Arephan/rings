# Downstream, and NOT wired — on purpose. It declares that it consumes the
# scout's rows, and then nothing in this ring ever opens the scout's file. This
# is the most common way a fleet lies to itself, so the example ships with it.
NAME="filer"
SCHEDULE="40 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/filed.md"
TIMEOUT=60
MAX_RUNS_PER_DAY=24
NOTIFY="none"

CONSUMES="scout.leads:kind=tender"
