# The smallest complete ring. Its "agent" is a shell script, so this example runs
# on a machine with no API key and no network — the point is the loop, not the model.
NAME="hello-ring"
SCHEDULE="*/30 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/last.md"
TIMEOUT=30
MAX_RUNS_PER_DAY=48
NOTIFY="stdout"
