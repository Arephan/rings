# Middle of the chain. Takes prospects, sends proposals, hands them on.
NAME="bidder"
SCHEDULE="25 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/last.md"
TIMEOUT=60
MAX_RUNS_PER_DAY=24
NOTIFY="none"
CONSUMES="prospect.qualified@1"
EMITS="proposal.sent@1"
MAX_ATTEMPTS=3
INBOX_MAX=5
