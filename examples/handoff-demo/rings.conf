# Copy this fleet into $RINGS_HOME to try it:
#   cp -r examples/handoff-demo/* ~/.rings/
#   rings run scout && rings run bidder && rings run closer
#   rings goals; rings feed; rings trace <the deal's id>
APEX="signed work, and nothing that does not lead to it"
SINKS="revenue:Money in"

# The chain: the types that feed a sink, in order. The last one is the outcome,
# and an outcome needs ref= into the system where it actually happened.
CHAIN_revenue="prospect.qualified@1 proposal.sent@1 deal.signed@1"
