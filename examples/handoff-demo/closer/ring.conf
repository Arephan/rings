# End of the chain. Watches for signed deals and records the outcome — with a
# ref into the contract system, because the apex only moves on outside evidence.
NAME="closer"
SCHEDULE="45 * * * *"
AGENT="bash agent.sh"
PROMPT_MODE="arg"
DELIVERABLE="out/last.md"
TIMEOUT=60
MAX_RUNS_PER_DAY=24
NOTIFY="none"
CONSUMES="proposal.sent@1"
EMITS="deal.signed@1"
